<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="educk shows live and day-ahead renewable electricity share across European grids, so you can use power when it's greenest.">

  <!-- Open Graph / social previews -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="educk">
  <meta property="og:title" content="educk — live renewable electricity dashboard">
  <meta property="og:description" content="Track wind and solar share across European grids and shift energy use to cleaner, lower-carbon hours.">
  <meta property="og:url" content="https://educk.io/app">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="educk — live renewable electricity dashboard">
  <meta name="twitter:description" content="Track wind and solar share across European grids and shift energy use to cleaner, lower-carbon hours.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="educk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="logo_bw.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>educk — live renewable electricity dashboard for Europe</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Loading splash. Shown immediately (the Flutter engine + CanvasKit take a
    couple of seconds to download, compile and paint the first frame, during
    which the page would otherwise be blank). Removed on the `flutter-first-frame`
    event the engine fires once it has rendered. The markup is plain HTML/CSS so
    it paints before any JS runs — this is what gives the page early visible
    content (improves Speed Index and perceived load).
  -->
  <div id="splash" class="splash">
    <img class="splash__logo" src="logo_bw.svg" width="96" height="96" alt="educk">
    <div class="splash__spinner" role="progressbar" aria-label="Loading"></div>
  </div>
  <style>
    .splash {
      position: fixed; inset: 0; z-index: 2147483646;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 28px; background: #fafafa;
      opacity: 1; transition: opacity .3s ease;
    }
    .splash--hidden { opacity: 0; pointer-events: none; }
    .splash__logo { display: block; }
    .splash__spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(46, 125, 50, .2);
      border-top-color: #2e7d32;
      animation: splash-spin .8s linear infinite;
    }
    @keyframes splash-spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      .splash { background: #121212; }
      .splash__spinner { border-color: rgba(76, 222, 128, .25); border-top-color: #4ade80; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash__spinner { animation: none; }
      .splash { transition: none; }
    }
  </style>
  <script>
    // Remove the splash once Flutter has painted its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('splash--hidden');
      splash.addEventListener('transitionend', function () { splash.remove(); }, { once: true });
      // Fallback in case the transition doesn't fire (e.g. reduced motion).
      setTimeout(function () { if (splash.isConnected) splash.remove(); }, 500);
    });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Cookie consent banner + consent-gated Google Analytics loader.
    Mirrors the server-rendered pages' templates/_cookie_consent.html: gtag.js is
    loaded only after the visitor agrees (GDPR + German TDDDG). The choice is kept
    in the first-party `educk_consent` cookie. Links point at the apex routes
    (/privacy, /impressum), which are served by the Rust app on the same origin.
  -->
  <div id="cookie-banner" class="cookie-banner" role="dialog" aria-live="polite"
       aria-label="Cookie consent" hidden>
    <div class="cookie-banner__text">
      educk uses Google Analytics to understand how the dashboard is used. Analytics
      cookies are only set if you agree. See our
      <a href="/privacy">privacy&nbsp;policy</a>.
    </div>
    <div class="cookie-banner__actions">
      <button type="button" id="cookie-decline" class="cookie-btn cookie-btn--ghost">Decline</button>
      <button type="button" id="cookie-accept" class="cookie-btn cookie-btn--primary">Accept</button>
    </div>
  </div>
  <style>
    .cookie-banner {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 2147483647;
      display: flex; flex-wrap: wrap; gap: 14px 20px;
      align-items: center; justify-content: center;
      padding: 16px 20px; background: #1a1a1a; color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: .92rem; line-height: 1.5;
      box-shadow: 0 -2px 14px rgba(0, 0, 0, .3);
    }
    .cookie-banner[hidden] { display: none; }
    .cookie-banner__text { max-width: 620px; }
    .cookie-banner a { color: #4ade80; }
    .cookie-banner__actions { display: flex; gap: 10px; flex-shrink: 0; }
    .cookie-btn {
      font: inherit; font-weight: 600; padding: .55rem 1.3rem;
      border-radius: 6px; border: 1px solid transparent; cursor: pointer;
    }
    .cookie-btn--primary { background: #15803d; color: #fff; }
    .cookie-btn--primary:hover { background: #166534; }
    .cookie-btn--ghost { background: transparent; color: #f5f5f5; border-color: #555; }
    .cookie-btn--ghost:hover { border-color: #888; }
  </style>
  <script>
    (function () {
      var GA_ID = 'G-82NPT4CT5G';
      var COOKIE = 'educk_consent';

      function readConsent() {
        var m = document.cookie.match(/(?:^|;\s*)educk_consent=([^;]+)/);
        return m ? m[1] : null;
      }
      function writeConsent(value) {
        var oneYear = 60 * 60 * 24 * 365;
        document.cookie = COOKIE + '=' + value + ';path=/;max-age=' + oneYear + ';SameSite=Lax';
      }
      function loadAnalytics() {
        if (window.__educkGaLoaded) return;
        window.__educkGaLoaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA_ID;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', GA_ID);
      }

      var banner = document.getElementById('cookie-banner');
      var consent = readConsent();
      if (consent === 'granted') {
        loadAnalytics();
      } else if (consent !== 'denied' && banner) {
        banner.hidden = false;
      }

      var accept = document.getElementById('cookie-accept');
      var decline = document.getElementById('cookie-decline');
      if (accept) accept.addEventListener('click', function () {
        writeConsent('granted');
        if (banner) banner.hidden = true;
        loadAnalytics();
      });
      if (decline) decline.addEventListener('click', function () {
        writeConsent('denied');
        if (banner) banner.hidden = true;
      });
    })();
  </script>
</body>
</html>
