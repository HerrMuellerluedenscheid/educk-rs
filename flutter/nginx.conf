server {
    listen 80;
    # Flutter bundle is copied into the `app/` subdirectory (see Dockerfile), so
    # requests to /app/<file> map to <root>/app/<file> with the server `root`.
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/wasm
        application/json
        image/svg+xml;

    # ── Cache: hashed assets (Flutter appends content hashes) ────────────────
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Flutter dashboard at /app ────────────────────────────────────────────
    # Built with --base-href=/app/ so all in-app asset URLs are /app/-prefixed.
    location = /app { return 308 /app/; }

    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /app/ {
        # SPA fallback: client-side routes resolve to the app entry point.
        try_files $uri $uri/ /app/index.html;
    }

    # ── Everything else → Rust SSR / content / API ───────────────────────────
    # Landing page, /electricity/*, /robots.txt, /sitemap.xml, /api/v1/* all
    # come from the Rust service. `renewable-api` is the docker-compose service
    # name, resolved via the compose embedded DNS.
    location / {
        proxy_pass http://renewable-api:3044;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
