server {
    listen 80;
    # Pure reverse proxy: this front door no longer serves any local files. The
    # dashboard moved into the Rust service (/app), so everything is proxied.

    # Docker's embedded DNS. Resolving the backend at runtime (rather than once at
    # startup) means nginx (a) still boots when the API is momentarily down or
    # unresolvable, and (b) picks up the API's new IP after each redeploy instead
    # of caching a stale one. `valid` caps how long a resolution is reused.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ── Compression ──────────────────────────────────────────────────────────
    # Dynamic gzip/brotli over the proxied Rust responses (HTML, JSON, and the
    # dashboard's JS/CSS). No *_static: there are no local files to precompress.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/wasm
        application/json
        image/svg+xml;

    brotli on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/wasm
        application/json
        image/svg+xml;

    # ── Everything → Rust SSR / dashboard / API ──────────────────────────────
    # The lightweight dashboard now lives in the Rust service at /app (it replaced
    # the Flutter bundle). Landing page, /app, /electricity/*, /robots.txt,
    # /sitemap.xml, /api/v1/* all come from the Rust service. The upstream host is
    # held in a variable so it is resolved via `resolver` at request time (see
    # above) rather than pinned at boot. `renewable-api` is the compose service
    # name; on hosts where the API service has a different name, give it a
    # `renewable-api` network alias.
    location / {
        set $educk_backend renewable-api;
        proxy_pass http://$educk_backend:3044$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
