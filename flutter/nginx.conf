server {
    listen 80;
    # Flutter bundle is copied into the `app/` subdirectory (see Dockerfile), so
    # requests to /app/<file> map to <root>/app/<file> with the server `root`.
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend at runtime (rather than once at
    # startup) means nginx (a) still boots when the API is momentarily down or
    # unresolvable, and (b) picks up the API's new IP after each redeploy instead
    # of caching a stale one. `valid` caps how long a resolution is reused.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # ── Compression ──────────────────────────────────────────────────────────
    # *_static on: serve the build-time .br/.gz siblings (see Dockerfile compress
    # stage) when the client accepts them, avoiding per-request compression of the
    # immutable, content-hashed bundle. Dynamic brotli/gzip still covers the
    # proxied Rust SSR HTML, which has no precompressed variant on disk.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/wasm
        application/json
        image/svg+xml;

    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/wasm
        application/json
        image/svg+xml;

    # ── Cache: hashed assets (Flutter appends content hashes) ────────────────
    location ~* \.(js|wasm|css|png|jpg|jpeg|gif|ico|svg|ttf|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Flutter dashboard at /app ────────────────────────────────────────────
    # Built with --base-href=/app/ so all in-app asset URLs are /app/-prefixed.
    location = /app { return 308 /app/; }

    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /app/ {
        # SPA fallback: client-side routes resolve to the app entry point.
        try_files $uri $uri/ /app/index.html;
    }

    # ── Everything else → Rust SSR / content / API ───────────────────────────
    # Landing page, /electricity/*, /robots.txt, /sitemap.xml, /api/v1/* all come
    # from the Rust service. The upstream host is held in a variable so it is
    # resolved via `resolver` at request time (see above) rather than pinned at
    # boot. `renewable-api` is the compose service name; on hosts where the API
    # service has a different name, give it a `renewable-api` network alias.
    location / {
        set $educk_backend renewable-api;
        proxy_pass http://$educk_backend:3044$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
