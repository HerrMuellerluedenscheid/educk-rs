version: '3.8'

services:
  renewable-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewable-energy-api
    # Front door: the Rust service now serves the SSR site, the /app dashboard and
    # the API directly (with built-in gzip/brotli), so it is exposed on :80. The
    # former nginx + Flutter `dashboard` container is gone.
    ports:
      - "80:3044"
      - "3044:3044"
    environment:
      - ENTSOE_API_KEY=${ENTSOE_API_KEY}
      - RUST_LOG=info
      # Apex origin used for canonical URLs, Open Graph tags and the sitemap.
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://educk.io}
      # Daily Instagram Story (Germany). Leave the token unset to disable.
      - INSTAGRAM_ACCESS_TOKEN=${INSTAGRAM_ACCESS_TOKEN:-}
      - INSTAGRAM_STORY_TIME=${INSTAGRAM_STORY_TIME:-07:00}
      - DATA_DIR=/app/data
    volumes:
      # Keeps the auto-refreshed Instagram token and the last-posted date
      # across deploys.
      - educk-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3044/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  educk-data:
