version: '3.8'

services:
  renewable-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: renewable-energy-api
    ports:
      - "3044:3044"
    environment:
      - ENTSOE_API_TOKEN=${ENTSOE_API_TOKEN}
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3044/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    image: ghcr.io/herrmuellerluedenscheid/educk-rs-dashboard:latest
    build:
      context: flutter
      dockerfile: Dockerfile
      args:
        # URL the *browser* uses to reach the API — must be publicly accessible
        - API_URL=${API_URL:-http://37.27.47.184:3044}
    container_name: energy-dashboard
    ports:
      - "80:80"
    restart: unless-stopped
